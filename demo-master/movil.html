<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonrisa Premium · versión móvil</title>
<meta name="robots" content="noindex">
<!-- ============================================================
     VISTA MÓVIL para el video Loom.
     Muestra la demo final (./index.html) dentro de un celular grande
     y centrado. El iframe va a 430px (iPhone 15 Pro Max) para que la
     demo renderice su layout móvil real; el celular entero se escala
     para llenar la pantalla sin importar el tamaño del monitor.
     Solo cambia de pestaña en el Loom y muestra "también en el celular".
     ============================================================ -->
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:radial-gradient(circle at 50% 28%, #1d3a58 0%, #0c1a29 58%, #060d16 100%);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  .phone-scaler{ transform-origin:center center; }
  .device-phone{
    width:458px;                 /* 430 pantalla + 2x14 padding */
    background:#050610;
    border-radius:56px;
    padding:14px;
    border:4px solid rgba(255,255,255,0.22);
    box-shadow:0 34px 100px rgba(0,0,0,0.72), inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  .notch{ width:128px; height:9px; background:#14151f; border-radius:5px; margin:3px auto 11px; }
  .screen{
    width:430px; height:932px;
    border-radius:42px; overflow:hidden;
    background:#1e3a52; position:relative;
  }
  .screen iframe{
    width:430px; height:932px; border:none; display:block;
  }
  .home{ width:134px; height:6px; background:#14151f; border-radius:3px; margin:11px auto 3px; }
</style>
</head>
<body>
  <div class="phone-scaler" id="scaler">
    <div class="device-phone" id="phone">
      <div class="notch"></div>
      <div class="screen"><iframe src="./index.html" title="Demo Sonrisa Premium en celular" loading="eager"></iframe></div>
      <div class="home"></div>
    </div>
  </div>
<script>
  // Escala el celular completo para que quepa en cualquier monitor (Mac 13" o 32").
  function fit(){
    var phone = document.getElementById('phone');
    var scaler = document.getElementById('scaler');
    var w = phone.offsetWidth, h = phone.offsetHeight;
    if(!w || !h) return;
    var s = Math.min((window.innerHeight*0.96)/h, (window.innerWidth*0.96)/w);
    scaler.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  fit();
</script>
</body>
</html>
