<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afiche reseñas · Ten Salud Oral</title>
<meta name="robots" content="noindex">
<!-- ============================================================
     AFICHE IMPRIMIBLE · QR de reseñas (limpio, sin marca Pronto)
     El dentista lo imprime y lo pega en recepción / sala de espera.
     PERSONALIZACIÓN: editar CONFIG (nombre + URL de reseñas).
     El QR apunta a la página /reviews (filtro 5★), NO directo a Google.
     Imprimir: Cmd+P → tamaño carta/A4 vertical.
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --azul-dark:#1e3a52; --azul:#3a7ca5; --gold:#f5a623; --text:#15293c; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:'Manrope',sans-serif; background:#e8eef3; color:var(--text); display:flex; flex-direction:column; align-items:center; padding:24px; }
  .toolbar{ margin-bottom:16px; }
  .toolbar button{ background:var(--azul-dark); color:#fff; border:none; font-family:'Manrope',sans-serif; font-weight:600; font-size:14px; padding:11px 22px; border-radius:999px; cursor:pointer; }
  .afiche{
    width:794px; min-height:1123px; /* A4 a 96dpi */
    background:linear-gradient(170deg,#ffffff 0%,#eef4f9 100%);
    border-radius:20px; box-shadow:0 20px 60px rgba(30,58,82,.18);
    padding:80px 70px; text-align:center;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .afiche .clinica{ font-family:'Manrope',sans-serif; font-weight:700; font-size:18px; letter-spacing:.16em; text-transform:uppercase; color:var(--azul); margin-bottom:48px; }
  .afiche h1{ font-family:'Fraunces',serif; font-weight:400; font-size:58px; line-height:1.05; color:var(--azul-dark); margin-bottom:22px; }
  .afiche .sub{ font-size:21px; color:#4a5a6e; line-height:1.5; margin-bottom:36px; max-width:520px; }
  .stars{ font-size:46px; letter-spacing:10px; color:var(--gold); margin-bottom:44px; }
  .qr-box{ background:#fff; border:1px solid #d8e2ea; border-radius:24px; padding:28px; box-shadow:0 10px 30px rgba(30,58,82,.10); margin-bottom:28px; }
  .qr-box img{ display:block; width:320px; height:320px; }
  .scan{ font-family:'Manrope',sans-serif; font-weight:600; font-size:19px; color:var(--azul-dark); }
  .scan span{ display:block; font-weight:500; font-size:15px; color:#7e93a6; margin-top:6px; }
  @media print{
    @page{ margin:8mm; }
    body{ background:#fff; padding:0; }
    .toolbar{ display:none; }
    .afiche{ box-shadow:none; border-radius:0; width:100%; min-height:auto; padding:18px 40px; justify-content:flex-start; }
    .afiche .clinica{ margin-bottom:26px; }
    .afiche h1{ margin-bottom:16px; }
    .afiche .sub{ margin-bottom:24px; }
    .stars{ margin-bottom:26px; }
    .qr-box{ margin-bottom:18px; padding:18px; }
    .qr-box img{ width:280px; height:280px; }
  }
</style>
</head>
<body>
  <div class="toolbar"><button onclick="window.print()">📄 Guardar como PDF</button></div>

  <div class="afiche">
    <div class="clinica" id="clinica">Ten Salud Oral</div>
    <h1>¿Te gustó<br>tu visita?</h1>
    <p class="sub">Una reseña tuya en Google nos ayuda muchísimo. Solo te toma 10 segundos.</p>
    <div class="stars">★★★★★</div>
    <div class="qr-box"><img id="qr" alt="Código QR para dejar tu reseña"></div>
    <div class="scan">Escanea con la cámara de tu celular<span>Apunta y toca el enlace que aparece</span></div>
  </div>

<script>
  // ===== PERSONALIZACIÓN POR CLIENTE =====
  const CONFIG = {
    clinica: "Ten Salud Oral",
    // URL de la página de reseñas con filtro 5★ (NO Google directo).
    // En cliente real: https://suclinica.com/reviews
    reviewUrl: "https://prontoweb.co/clientes-piloto/ten-salud-oral/reviews.html"
  };
  document.getElementById('clinica').textContent = CONFIG.clinica;
  document.getElementById('qr').src =
    "https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=0&qzone=1&data=" +
    encodeURIComponent(CONFIG.reviewUrl);
</script>
</body>
</html>
