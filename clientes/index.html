<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes · Pronto</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a; --panel:rgba(255,255,255,0.035); --panel2:rgba(255,255,255,0.06);
    --text:#E6E8F0; --muted:#B0B6CC; --dim:#7c84a0;
    --cyan:#22d3ee; --grad:linear-gradient(135deg,#0891b2,#22d3ee);
    --border:rgba(255,255,255,0.12); --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif; background:
    radial-gradient(70% 50% at 85% 0%, rgba(34,211,238,0.08), transparent 60%), var(--bg);
    color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;}
  a{color:var(--cyan);}
  .wrap{max-width:1100px; margin:0 auto; padding:26px 22px 80px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:26px;}
  .logo{font-family:'Space Grotesk'; font-weight:700; font-size:22px; background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .logout{font-size:13px; color:var(--dim); cursor:pointer; background:none; border:none; font-family:'Inter';}
  .logout:hover{color:var(--muted);}
  h1{font-family:'Space Grotesk'; font-weight:700; font-size:26px; letter-spacing:-0.01em;}
  .sub{color:var(--dim); font-size:14px; margin-top:2px;}
  /* Login */
  .login{max-width:380px; margin:14vh auto 0; text-align:center;}
  .login h1{font-size:28px; margin-bottom:8px;}
  .login p{color:var(--muted); font-size:15px; margin-bottom:24px;}
  input[type=password],input[type=text],input.search{width:100%; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:14px 16px; font-family:inherit; font-size:15px;}
  input:focus{outline:none; border-color:var(--cyan); background:var(--panel2);}
  .btn{font-family:'Space Grotesk'; font-weight:600; font-size:15px; border:none; border-radius:999px; padding:13px 26px; cursor:pointer; background:var(--grad); color:#06121a; margin-top:14px;}
  .btn:hover{transform:translateY(-1px);}
  .err{color:#f87171; font-size:13.5px; margin-top:12px; min-height:18px;}
  /* List */
  .toolbar{display:flex; gap:12px; align-items:center; margin:18px 0 16px;}
  .toolbar .search{flex:1;}
  .count{color:var(--dim); font-size:13px; white-space:nowrap;}
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; cursor:pointer; transition:all .2s;}
  .card:hover{border-color:var(--cyan); background:var(--panel2); transform:translateY(-2px);}
  .card .cn{font-family:'Space Grotesk'; font-weight:600; font-size:17px; margin-bottom:6px;}
  .card .meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .chip{font-size:11.5px; padding:4px 10px; border-radius:999px; background:var(--panel2); border:1px solid var(--border); color:var(--muted);}
  .chip.cy{color:var(--cyan); border-color:rgba(34,211,238,0.4);}
  .card .date{color:var(--dim); font-size:12.5px; margin-top:10px;}
  .empty{color:var(--dim); text-align:center; padding:60px 0; font-size:15px;}
  /* Detail */
  .back{display:inline-flex; align-items:center; gap:7px; color:var(--muted); font-size:14px; cursor:pointer; background:none; border:none; font-family:'Inter'; margin-bottom:18px;}
  .back:hover{color:var(--text);}
  .det-head{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:6px;}
  .det-head h1{font-size:28px;}
  .section{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin-top:16px;}
  .section h3{font-family:'Space Grotesk'; font-weight:600; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--cyan); margin-bottom:14px;}
  .field{display:grid; grid-template-columns:200px 1fr; gap:14px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.06); font-size:14.5px;}
  .field:last-child{border-bottom:none;}
  .field .k{color:var(--dim);}
  .field .v{color:var(--text); word-break:break-word;}
  .gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .gallery a{display:block; aspect-ratio:1; border-radius:12px; overflow:hidden; border:1px solid var(--border); background:var(--panel2);}
  .gallery img{width:100%; height:100%; object-fit:cover;}
  .logo-box{display:inline-block; max-width:200px; background:#fff; border-radius:12px; padding:14px;}
  .logo-box img{max-width:100%; display:block;}
  .filelink{display:inline-block; padding:9px 14px; color:#0891b2; background:rgba(34,211,238,0.12); border:1px solid var(--border); border-radius:8px; font-size:13px; text-decoration:none; font-weight:600;}
  .filelink:hover{background:rgba(34,211,238,0.2);}
  .note{color:var(--dim); font-size:13px; margin-top:8px;}
  .hidden{display:none;}
  @media(max-width:560px){ .field{grid-template-columns:1fr; gap:2px;} .det-head h1{font-size:23px;} }
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <section id="login" class="login">
    <div class="logo" style="font-size:26px;margin-bottom:18px">Pronto</div>
    <h1>Panel de clientes</h1>
    <p>Ingresa tu clave de acceso.</p>
    <input type="password" id="token" placeholder="Clave del panel" autocomplete="off">
    <div><button class="btn" onclick="doLogin()">Entrar</button></div>
    <div class="err" id="loginErr"></div>
  </section>

  <!-- APP -->
  <div id="app" class="hidden">
    <div class="topbar">
      <div class="logo">Pronto</div>
      <button class="logout" onclick="logout()">Cerrar sesión</button>
    </div>

    <!-- LIST -->
    <section id="listView">
      <h1>Clientes</h1>
      <div class="sub">Onboarding recibido. Clic en uno para ver toda su info y fotos.</div>
      <div class="toolbar">
        <input class="search" id="search" placeholder="Buscar por clínica o correo…" oninput="renderList()">
        <span class="count" id="count"></span>
      </div>
      <div class="cards" id="cards"></div>
      <div class="empty hidden" id="empty">Aún no hay envíos. Cuando un cliente llene el formulario, aparece aquí.</div>
    </section>

    <!-- DETAIL -->
    <section id="detailView" class="hidden">
      <button class="back" onclick="showList()">← Volver a la lista</button>
      <div id="detailBody"></div>
    </section>
  </div>
</div>

<script>
  const WORKER = "https://pronto-forms-worker.cesargomezs711.workers.dev";
  let token = localStorage.getItem('pronto_panel_token') || '';
  let items = [];

  function esc(s){ return String(s==null?'':s).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDate(iso){ if(!iso) return '—'; var d=new Date(iso); if(isNaN(d.getTime())) return esc(iso); return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}); }
  // Archivos: se cargan con fetch + header (el token NUNCA viaja en la URL) y se muestran vía blob local
  let blobUrls = [];
  function revokeBlobs(){ blobUrls.forEach(u=>{ try{ URL.revokeObjectURL(u); }catch(e){} }); blobUrls=[]; }
  async function fetchBlob(key){
    const r = await fetch(WORKER+'/onboarding/file/'+encodeURIComponent(key), { headers:{ 'X-Panel-Token': token } });
    if(!r.ok) throw new Error('file '+r.status);
    const url = URL.createObjectURL(await r.blob()); blobUrls.push(url); return url;
  }
  async function loadImg(img){
    try{ const url = await fetchBlob(img.getAttribute('data-r2key')); img.src=url; const a=img.closest('a'); if(a) a.href=url; }
    catch(e){ imgFail(img); }
  }
  async function openFile(btn){
    try{ const url = await fetchBlob(btn.getAttribute('data-r2key')); window.open(url,'_blank'); }
    catch(e){ alert('No se pudo abrir el archivo.'); }
  }
  function loadDetailImages(){ document.querySelectorAll('#detailBody img[data-r2key]').forEach(loadImg); }
  // si una imagen no carga, la cambia por un link de descarga (nombre como textNode, sin XSS)
  function imgFail(img){ var a=img.parentNode; var n=img.getAttribute('data-name')||'archivo'; img.remove(); if(a){ a.classList.add('filelink'); a.appendChild(document.createTextNode('⬇ '+n)); } }

  async function api(path){
    const r = await fetch(WORKER+path, { headers:{ 'X-Panel-Token': token } });
    if(r.status===401){ throw {auth:true}; }
    if(!r.ok) throw new Error('status '+r.status);
    return r.json();
  }

  async function doLogin(){
    token = document.getElementById('token').value.trim();
    document.getElementById('loginErr').textContent='';
    if(!token){ document.getElementById('loginErr').textContent='Escribe la clave.'; return; }
    try{
      const d = await api('/onboarding/list');
      localStorage.setItem('pronto_panel_token', token);
      items = d.items||[];
      enterApp();
    }catch(e){
      document.getElementById('loginErr').textContent = e.auth ? 'Clave incorrecta.' : 'No se pudo conectar.';
    }
  }
  function logout(){ localStorage.removeItem('pronto_panel_token'); token=''; location.reload(); }

  function enterApp(){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    showList(); renderList();
  }
  function showList(){ revokeBlobs(); document.getElementById('listView').classList.remove('hidden'); document.getElementById('detailView').classList.add('hidden'); window.scrollTo(0,0); }

  function renderList(){
    const q = (document.getElementById('search').value||'').toLowerCase();
    const list = items.filter(it => !q || (it.clinica_nombre||'').toLowerCase().includes(q) || (it.email_reportes||'').toLowerCase().includes(q) || (it.web_url||'').toLowerCase().includes(q));
    document.getElementById('count').textContent = list.length + (list.length===1?' cliente':' clientes');
    const raw=(document.getElementById('search').value||'').trim();
    const empty=document.getElementById('empty');
    empty.textContent = items.length===0 ? 'Aún no hay envíos. Cuando un cliente llene el formulario, aparece aquí.' : ('Sin resultados para "'+raw+'".');
    empty.classList.toggle('hidden', list.length>0);
    const c = document.getElementById('cards'); c.innerHTML='';
    list.forEach(it=>{
      const el=document.createElement('div'); el.className='card'; el.onclick=()=>openDetail(it.id);
      const nombre = it.clinica_nombre || it.web_url || it.email_reportes || '(sin nombre)';
      el.innerHTML = '<div class="cn">'+esc(nombre)+'</div>'+
        '<div class="meta">'+
          '<span class="chip cy">'+(it.path==='B'?'Sin web':'Con web')+'</span>'+
          '<span class="chip">'+esc(it.estado||'nuevo')+'</span>'+
          (it.n_fotos? '<span class="chip">'+it.n_fotos+' foto'+(it.n_fotos>1?'s':'')+'</span>':'')+
          (it.has_logo? '<span class="chip">logo</span>':'')+
        '</div>'+
        '<div class="date">'+fmtDate(it.created_at)+'</div>';
      c.appendChild(el);
    });
  }

  async function openDetail(id){
    try{
      const d = await api('/onboarding/'+id);
      revokeBlobs();
      renderDetail(d.item);
      document.getElementById('listView').classList.add('hidden');
      document.getElementById('detailView').classList.remove('hidden');
      window.scrollTo(0,0);
      loadDetailImages();
    }catch(e){ if(e&&e.auth){ alert('Tu sesión expiró. Vuelve a entrar.'); logout(); } else { alert('No se pudo abrir el cliente. Revisa tu conexión e inténtalo de nuevo.'); } }
  }

  function field(k,v){ if(!v) return ''; return '<div class="field"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>'; }
  function linkField(k,u){ if(!u) return ''; var href=/^https?:\/\//.test(u)?u:'https://'+u; return '<div class="field"><div class="k">'+esc(k)+'</div><div class="v"><a href="'+esc(href)+'" target="_blank">'+esc(u)+'</a></div></div>'; }

  function renderDetail(it){
    const nombre = it.clinica_nombre || it.web_url || '(sin nombre)';
    const dominio = it.dominio_tiene==='si' ? ('Conserva: '+(it.dominio_actual||'—')) : ('Nuevo · ideas: '+(it.dominio_ideas||'(las elegimos nosotros)'));
    const fotos = (it.files||[]).filter(f=>f.kind==='foto');
    const logos = (it.files||[]).filter(f=>f.kind==='logo');

    let html = '<div class="det-head"><h1>'+esc(nombre)+'</h1>'+
      '<span class="chip cy">'+(it.path==='B'?'Sin web':'Con web')+'</span>'+
      '<span class="chip">'+esc(it.estado||'nuevo')+'</span></div>'+
      '<div class="sub">'+fmtDate(it.created_at)+'</div>';

    // Links / presencia
    if(it.web_url||it.instagram||it.facebook||it.google_url){
      html += '<div class="section"><h3>Presencia online</h3>'+
        linkField('Web actual', it.web_url)+linkField('Instagram', it.instagram)+linkField('Facebook', it.facebook)+linkField('Google / Maps', it.google_url)+
        field('Modo', it.modo==='todo'?'Saquen todo de mis links':(it.modo==='cambiar'?'Quiere cambiar/agregar cosas':''))+'</div>';
    }
    // Clínica (camino B)
    if(it.clinica_direccion||it.clinica_horarios||it.clinica_servicios||it.clinica_equipo){
      html += '<div class="section"><h3>La clínica</h3>'+
        field('Dirección / sedes', it.clinica_direccion)+field('Horarios', it.clinica_horarios)+field('Servicios', it.clinica_servicios)+field('Equipo', it.clinica_equipo)+'</div>';
    }
    // Esenciales
    html += '<div class="section"><h3>Esenciales</h3>'+
      field('WhatsApp público', it.wa_publico)+field('WhatsApp recepción', it.wa_recepcion)+field('Correo reportes', it.email_reportes)+
      field('¿Mostrar precios?', it.precios)+field('Dominio', dominio)+'</div>';
    // Facturación (solo si hay datos)
    var fact = field('Titular', it.fact_titular)+field('Identificación', (it.id_tipo?it.id_tipo+' ':'')+(it.id_numero||''));
    if(fact.trim()) html += '<div class="section"><h3>Facturación</h3>'+fact+'</div>';
    // Cambios
    if(it.cambios) html += '<div class="section"><h3>Quiere cambiar / agregar</h3><div class="v" style="font-size:14.5px">'+esc(it.cambios)+'</div></div>';
    // Logo
    if(logos.length){
      var lg=logos[0], lct=(lg.content_type||''), lren=lct.indexOf('image/')===0 && lct.indexOf('svg')<0;
      var lhtml = lren
        ? '<div class="logo-box"><a target="_blank"><img alt="logo" data-r2key="'+esc(lg.r2_key)+'" data-name="'+esc(lg.original_name||'logo')+'"></a></div>'
        : '<button type="button" class="filelink" data-r2key="'+esc(lg.r2_key)+'" onclick="openFile(this)">⬇ Ver / descargar logo ('+esc(lg.original_name||'archivo')+')</button>';
      html += '<div class="section"><h3>Logo</h3>'+lhtml+'</div>';
    }
    // Fotos
    if(fotos.length){
      html += '<div class="section"><h3>Fotos ('+fotos.length+')</h3><div class="gallery">'+
        fotos.map(f=>'<a target="_blank"><img alt="foto" data-r2key="'+esc(f.r2_key)+'" data-name="'+esc(f.original_name||'foto')+'"></a>').join('')+'</div></div>';
    } else {
      html += '<div class="section"><h3>Fotos</h3><div class="note">Sin fotos subidas (se sacan de su web), o R2 aún no estaba activo cuando llenó el formulario.</div></div>';
    }
    // Consentimiento
    html += '<div class="section"><h3>Consentimiento (Ley 1581)</h3>'+
      field('Datos personales', it.consent_ley? 'Aceptado':'—')+field('Uso de contenido', it.consent_uso?'Aceptado':'—')+
      field('IP', it.consent_ip||'—')+field('Fecha servidor', fmtDate(it.created_at))+'</div>';

    document.getElementById('detailBody').innerHTML = html;
  }

  // arranque
  if(token){
    api('/onboarding/list').then(d=>{ items=d.items||[]; enterApp(); }).catch(()=>{ /* token viejo/ inválido */ localStorage.removeItem('pronto_panel_token'); token=''; });
  }
</script>
</body>
</html>
