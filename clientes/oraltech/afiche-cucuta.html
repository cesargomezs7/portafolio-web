<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1F234F">
<title>OralTech Cúcuta · Afiche de reseñas</title>
<!-- Tarjeta de vista previa (WhatsApp, Facebook, LinkedIn, iMessage).
     Sin esto el enlace llega como texto pelado y casi nadie lo abre.
     ⚠ Las URL apuntan a prontoweb.co. El día que la web pase al
     dominio de OralTech hay que cambiarlas aquí, igual que los QR. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="OralTech">
<meta property="og:locale" content="es_CO">
<meta property="og:title" content="OralTech Cúcuta · Afiche de reseñas">
<meta property="og:description" content="OralTech · Odontología en Cúcuta y Medellín.">
<meta property="og:url" content="https://prontoweb.co/clientes/oraltech/afiche-cucuta.html">
<meta property="og:image" content="https://prontoweb.co/clientes/oraltech/img/og-oraltech.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Pacientes de OralTech sonriendo">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="OralTech Cúcuta · Afiche de reseñas">
<meta name="twitter:description" content="OralTech · Odontología en Cúcuta y Medellín.">
<meta name="twitter:image" content="https://prontoweb.co/clientes/oraltech/img/og-oraltech.jpg">

<meta name="robots" content="noindex">
<!-- AFICHE DE CÚCUTA · generado el 8-sep-2026.
     El QR lleva a reviews.html?sede=cucuta: como el afiche está pegado
     EN esta sede, el paciente NO tiene que elegir sede, va directo a la
     ficha de Google de Cúcuta. Un paso menos.
     ⚠ El QR apunta a prontoweb.co. El día que la web pase al dominio de
     OralTech hay que REGENERARLO o dejará de funcionar. -->
<!-- ============================================================
     AFICHE IMPRIMIBLE · QR de reseñas (limpio, sin marca Pronto)
     El dentista lo imprime y lo pega en recepción / sala de espera.
     PERSONALIZACIÓN: editar CONFIG (nombre + URL de reseñas).
     El QR apunta a la página /reviews (filtro 5★), NO directo a Google.
     Imprimir: Cmd+P → tamaño carta/A4 vertical.
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ESCALA VISUAL (20-jun-2026): disenado al 150%; el 100% del visitante se ve asi. Escalonado; movil intacto. */
@media screen and (min-width: 1880px) { body { zoom: 1.5; } }
@media screen and (min-width: 1750px) and (max-width: 1879.98px) { body { zoom: 1.4; } }
@media screen and (min-width: 1550px) and (max-width: 1749.98px) { body { zoom: 1.25; } }
@media screen and (min-width: 1420px) and (max-width: 1549.98px) { body { zoom: 1.1; } }

  :root{ --black:#1F234F; --accent:#52589C; --ice:#EAEFF5; --ice-soft:#F5F8FB; --gray:#6B7186; --border:#DBE0E8; --text:#1F234F; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:'Inter',sans-serif; background:var(--ice); color:var(--text); display:flex; flex-direction:column; align-items:center; padding:24px; -webkit-font-smoothing:antialiased; }
  .toolbar{ margin-bottom:16px; }
  .toolbar button{ background:var(--black); color:#fff; border:none; font-family:'Inter',sans-serif; font-weight:500; font-size:14px; padding:11px 22px; border-radius:999px; cursor:pointer; }
  .afiche{
    width:794px; min-height:1123px; /* A4 a 96dpi */
    background:linear-gradient(170deg,#ffffff 0%,var(--ice-soft) 100%);
    border-radius:20px; box-shadow:0 20px 60px rgba(31,35,79,.18);
    padding:80px 70px; text-align:center;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .afiche .logo{ width:250px; height:auto; display:block; margin:0 auto 14px; }
  .afiche .sede{ font-family:'Inter',sans-serif; font-weight:600; font-size:14px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-bottom:44px; }
  .afiche .clinica{ font-family:'Inter',sans-serif; font-weight:600; font-size:15px; letter-spacing:.16em; text-transform:uppercase; color:var(--black); opacity:.75; margin-bottom:48px; }
  .afiche h1{ font-family:'Inter',sans-serif; font-weight:300; font-size:58px; line-height:1.05; letter-spacing:-0.03em; color:var(--black); margin-bottom:22px; }
  .afiche .sub{ font-size:17px; color:var(--gray); line-height:1.5; margin-bottom:36px; max-width:520px; }
  .stars{ font-size:46px; letter-spacing:10px; color:var(--accent); margin-bottom:44px; }
  .qr-box{ background:#fff; border:1px solid var(--border); border-radius:24px; padding:28px; box-shadow:0 10px 30px rgba(31,35,79,.10); margin-bottom:28px; }
  .qr-box img{ display:block; width:320px; height:320px; }
  .scan{ font-family:'Inter',sans-serif; font-weight:500; font-size:21px; color:var(--black); }
  .scan span{ display:block; font-weight:400; font-size:15px; color:var(--gray); margin-top:6px; }
  /* Son documentos A4: 794 px de ancho. En un celular se salen de la
     pantalla, así que se encogen con `zoom` —que recalcula la caja, cosa
     que transform:scale no hace— y solo en pantalla. Los valores salen de
     dividir el ancho útil entre 794, no de tantear: cada tramo se calcula por su ancho MÍNIMO (a 320 quedan 300 útiles,
     300/794 = 0,377, de ahí 0,36); calcularlo por el máximo dejaba fuera
     el extremo estrecho, medido fallando en 375 y 390. Al imprimir manda @page y sale
     a tamaño real. */
  @media screen and (max-width: 360px){ body{padding:10px} .afiche{ zoom:0.36; } }
  @media screen and (min-width:361px) and (max-width: 480px){ body{padding:10px} .afiche{ zoom:0.42; } }
  @media screen and (min-width:481px) and (max-width: 640px){ body{padding:12px} .afiche{ zoom:0.57; } }
  @media screen and (min-width:641px) and (max-width: 860px){ body{padding:14px} .afiche{ zoom:0.77; } }
  @media print{
    @page{ margin:8mm; }
    body{ background:#fff; padding:0; }
    .toolbar{ display:none; }
    .afiche{ box-shadow:none; border-radius:0; width:100%; min-height:auto; padding:18px 40px; justify-content:flex-start; }
    .afiche .logo{ width:250px; height:auto; display:block; margin:0 auto 14px; }
  .afiche .sede{ font-family:'Inter',sans-serif; font-weight:600; font-size:14px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-bottom:44px; }
  .afiche .logo{ width:200px; margin-bottom:10px; }
    .afiche .sede{ margin-bottom:24px; }
    .afiche h1{ margin-bottom:16px; }
    .afiche .sub{ margin-bottom:24px; }
    .stars{ margin-bottom:26px; }
    .qr-box{ margin-bottom:18px; padding:18px; }
    .qr-box img{ width:280px; height:280px; }
  }
</style>
</head>
<body>
  <div class="toolbar"><button onclick="window.print()">📄 Guardar como PDF</button></div>

  <div class="afiche">
    <img class="logo" src="img/logo-oraltech-navy.png" width="1600" height="401" alt="OralTech">
    <div class="sede">Cúcuta · Quinta Oriental</div>
    <h1>¿Te gustó<br>tu visita?</h1>
    <p class="sub">Una reseña tuya en Google nos ayuda muchísimo. Solo te toma 10 segundos.</p>
    <div class="stars">★★★★★</div>
    <div class="qr-box"><img src="img/qr-resenas-cucuta.png" width="714" height="714"
         alt="Código QR para dejar tu reseña de la sede de Cúcuta"></div>
    <div class="scan">Escanea con la cámara de tu celular<span>Apunta y toca el enlace que aparece</span></div>
  </div>

</body>
</html>
